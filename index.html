<!DOCTYPE html>
<html>
<head>
  <title>Shadow World</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .box {
      padding: 40px;
      border: 1px solid #8a2be2;
      border-radius: 20px;
      box-shadow: 0 0 30px #8a2be2;
      background: #111118;
    }

    h1 {
      font-size: 45px;
      color: #c77dff;
    }

    p {
      color: #aaa;
      font-size: 18px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #8a2be2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #b44cff;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Shadow World</h1>
    <p>Welcome to my first website ⚡</p>
    <button onclick="alert('Welcome, Shadow!')">
      Enter
    </button>
  </div>

</body>
</html>
